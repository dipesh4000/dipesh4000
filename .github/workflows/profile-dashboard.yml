name: Refresh profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Generate profile cards
        run: python scripts/generate_profile_cards.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/about.svg assets/contributions.svg assets/popular-repos.svg assets/achievements.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi

          git commit -m "chore: refresh profile dashboard"
          git push
